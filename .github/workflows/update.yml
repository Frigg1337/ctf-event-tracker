name: Update CTF Tracker

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

concurrency:
  group: update-ctf-tracker
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Script
        env:
          DAYS_AHEAD: "14"
          LIMIT: "50"
          LOCAL_TZ: "Asia/Jakarta"
        run: python bot.py

      - name: Commit changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          # Email diambil dari repository secret (COMMIT_EMAIL) agar tidak hardcode di source.
          # Buat secret di Settings > Secrets and variables > Actions dengan nama COMMIT_EMAIL.
          git config --global user.name "Frigg1337"
          git config --global user.email "${{ secrets.COMMIT_EMAIL }}"

          git add README.md
          git add data/ 2>/dev/null || true

          git commit -m "🤖 Update jadwal CTF" --allow-empty

          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:main
